<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ISA - Intelligent Screening Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f9fafc;
    }
    h1 {
      color: #333;
    }
    textarea {
      width: 100%;
      height: 120px;
    }
    button {
      background-color: #0078d7;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #005fa3;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eef5ff;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>🤖 ISA - Intelligent Screening Assistant</h1>
  <p>Prueba rápida de evaluación con Java + Threads</p>

  <label>Pregunta:</label>
  <input id="pregunta" type="text" placeholder="Escribe tu pregunta aquí..." style="width:100%;"><br><br>

  <label>Respuesta:</label>
  <textarea id="respuesta" placeholder="Escribe tu respuesta aquí..."></textarea><br><br>

  <button onclick="evaluarSync()">Evaluar Sincrónico</button>
  <button onclick="evaluarAsync()">Evaluar Asíncrono</button>

  <div id="resultado" class="result"></div>

  <script>
    async function evaluarSync() {
      const pregunta = document.getElementById('pregunta').value;
      const respuesta = document.getElementById('respuesta').value;
      const res = await fetch('/api/evaluate_sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pregunta, respuesta })
      });
      const data = await res.json();
      document.getElementById('resultado').innerText = JSON.stringify(data, null, 2);
    }

    async function evaluarAsync() {
      const pregunta = document.getElementById('pregunta').value;
      const respuesta = document.getElementById('respuesta').value;
      const res = await fetch('/api/evaluate_async', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pregunta, respuesta })
      });
      const data = await res.text();
      document.getElementById('resultado').innerText = 'Request ID: ' + data;
    }
  </script>
</body>
</html>
